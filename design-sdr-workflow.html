<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDR Pipeline — Manual Workflow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --em:#34D399; --em-soft:rgba(52,211,153,.14); --em-text:#A7F3D0;
  --amb:#F2B544; --amb-soft:rgba(242,181,68,.10);
  --t1:#EAECEF; --t2:#8A93A6; --t3:#5A6374;
  --nf:#161B26; --nb:rgba(255,255,255,.10); --eb:rgba(255,255,255,.13);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  background:#0B0E16;
  font-family:'Inter',system-ui,sans-serif;
  color:var(--t1);
  overflow:hidden;
}
#app{position:relative;height:100vh;width:100vw;display:flex;flex-direction:column;}
#app::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 60% at 18% -5%,#15242F 0%,rgba(11,14,22,0) 55%);
}
header{
  padding:22px 34px 14px;display:flex;align-items:center;gap:16px;z-index:2;
  border-bottom:1px solid rgba(255,255,255,.05);
}
header .mark{width:30px;height:30px;border-radius:8px;background:var(--em-soft);
  display:flex;align-items:center;justify-content:center;color:var(--em);font-weight:700;font-size:15px;
  box-shadow:0 0 18px rgba(52,211,153,.25);}
header h1{font-size:17px;font-weight:600;letter-spacing:-.01em;}
header .sub{font-size:13px;color:var(--t2);font-weight:400;}
header .right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--t2);}
.chip{display:inline-flex;align-items:center;gap:6px;}
.dot{width:9px;height:9px;border-radius:50%;}
#scene{flex:1;position:relative;overflow:hidden;z-index:1;}
#scroller{position:absolute;left:0;right:0;top:0;will-change:transform;}
svg text{font-family:'Inter',system-ui,sans-serif;}
footer{
  z-index:3;padding:14px 34px 18px;border-top:1px solid rgba(255,255,255,.06);
  background:rgba(8,11,18,.72);backdrop-filter:blur(8px);
}
#track{height:6px;border-radius:999px;background:rgba(255,255,255,.08);position:relative;cursor:pointer;}
#fill{height:6px;border-radius:999px;background:var(--em);width:0%;box-shadow:0 0 12px rgba(52,211,153,.6);}
.row{display:flex;align-items:center;gap:16px;margin-top:14px;flex-wrap:wrap;}
button.ctrl{width:40px;height:40px;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);color:var(--t1);
  border-radius:10px;cursor:pointer;font-size:18px;transition:.15s;}
button.ctrl:hover{background:var(--em-soft);border-color:rgba(52,211,153,.5);}
button.ctrl:active{transform:scale(.95);}
.counter{font-size:13px;color:var(--t2);}
.counter b{color:var(--t1);font-weight:600;}
.spd{margin-left:auto;display:flex;align-items:center;gap:9px;}
input[type=range]{accent-color:var(--em);width:140px;height:4px;}
#spdo{font-size:13px;font-weight:600;min-width:32px;}
.now{display:flex;align-items:center;gap:12px;margin-top:13px;flex-wrap:wrap;}
.now .lbl{font-size:13px;color:var(--t2);}
#pill{font-size:13px;font-weight:600;padding:6px 15px;border-radius:9px;background:var(--em-soft);color:var(--em-text);}
.legend{margin-left:auto;display:inline-flex;gap:16px;font-size:12px;color:var(--t2);}
.kbd{font-size:11px;color:var(--t3);border:1px solid rgba(255,255,255,.1);border-radius:5px;padding:1px 6px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="mark">A</div>
    <div>
      <h1>Apsona SDR Pipeline <span class="sub">· manual workflow</span></h1>
    </div>
    <div class="right">
      <span class="chip"><span class="dot" style="background:var(--em);box-shadow:0 0 8px rgba(52,211,153,.8);"></span>Live path</span>
      <span class="chip"><span class="dot" style="background:var(--amb);border-radius:2px;"></span>Decision</span>
      <span class="chip" style="opacity:.55;"><span class="dot" style="background:#566072;border-radius:2px;"></span>Alternative</span>
      <span class="chip"><span class="dot" style="background:#00A1E0;border-radius:2px;"></span>Salesforce sync</span>
    </div>
  </header>

  <div id="scene">
    <div id="scroller">
      <svg width="100%" viewBox="0 0 680 1524" id="fl" preserveAspectRatio="xMidYMin meet">

          <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C2433"/><stop offset="1" stop-color="#10151E"/></linearGradient>
        </defs>
        <rect x="0" y="0" width="680" height="1524" fill="url(#dots)"/>
        <g id="eg"></g><g id="trail"></g><g id="ng"></g>
        <circle id="halo" r="0" fill="#34D399" opacity="0" filter="url(#glow)"/>
        <g id="badge" opacity="0"><rect x="0" y="-13" width="74" height="26" rx="7" fill="rgba(242,181,68,0.14)" stroke="rgba(242,181,68,0.55)" stroke-width="1"/><text id="badgetx" x="11" y="5" font-size="12" font-weight="600" fill="#F2B544"></text></g>
        <g id="tok"><rect id="tagbg" x="15" y="-12" width="60" height="24" rx="7" fill="#0F3D2E" stroke="rgba(52,211,153,0.4)" stroke-width="1"/><text id="tagtx" x="21" y="5" font-size="11.5" font-weight="600" fill="#A7F3D0"></text><circle r="10.5" fill="#34D399" filter="url(#glow)"/><circle r="3.8" fill="#ECFDF5"/></g>
      </svg>
    </div>
  </div>

  <footer>
    <div id="track"><div id="fill"></div></div>
    <div class="row">
      <button class="ctrl" id="prev" aria-label="Previous stage">‹</button>
      <button class="ctrl" id="tg" aria-label="Pause">❚❚</button>
      <button class="ctrl" id="next" aria-label="Next stage">›</button>
      <span class="counter">Stage <b id="sc">1</b> / <span id="st">27</span></span>
      <div class="spd">
        <span style="font-size:12px;color:var(--t2);">Speed</span>
        <input type="range" id="spd" min="0.25" max="2.5" step="0.05" value="1">
        <span id="spdo">1×</span>
      </div>
    </div>
    <div class="now">
      <span class="lbl">Now</span>
      <span id="pill">Build list</span>
      <span class="legend"><span class="kbd">Space</span> play/pause &nbsp; <span class="kbd">←</span> <span class="kbd">→</span> step</span>
    </div>
  </footer>
</div>
